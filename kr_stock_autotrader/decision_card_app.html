<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giraffe · 결정 카드</title>
<style>
:root{--primary:#2563eb;--primary-low:#eff6ff;--paper:#f8fafc;--sheet:#fff;--ink:#172033;--ink-low:#64748b;--divider:#dbe3ef;--success:#087443;--danger:#b42318;--radius:14px}*{box-sizing:border-box;min-width:0;max-width:100%}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;min-height:44px}button{cursor:pointer;border:1px solid var(--divider);border-radius:10px;padding:0 12px;background:var(--sheet);font-weight:700}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.top{position:sticky;top:0;z-index:2;background:var(--sheet);border-bottom:1px solid var(--divider)}.bar,.page{width:min(calc(100% - 32px),1120px);margin:auto}.bar{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;color:var(--primary);font-size:1.2rem}.page{padding:24px 0 48px}.eyebrow,.muted{margin:0}.eyebrow{color:var(--primary);font-weight:800}.muted{color:var(--ink-low)}h1{margin:4px 0 8px;font-size:clamp(1.8rem,5vw,2.5rem)}.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:18px 0}.box,.card,.detail{background:var(--sheet);border:1px solid var(--divider);border-radius:var(--radius);padding:14px;max-width:100%}.box small{color:var(--ink-low)}.box b{display:block;font-size:1.3rem}.tabs,.actions{display:flex;flex-wrap:wrap;gap:8px}.tabs{overflow-x:auto;padding-bottom:10px}.tabs button{white-space:nowrap}.active,.primary{background:var(--primary);border-color:var(--primary);color:#fff}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:14px}.list{display:grid;gap:10px}.card{cursor:pointer}.row{display:flex;justify-content:space-between;align-items:start;gap:8px}.tag{border-radius:999px;padding:3px 8px;background:var(--primary-low);font-size:.78rem;white-space:nowrap}.pass{color:var(--success)}.fail{color:var(--danger)}.detail{position:sticky;top:78px;max-height:calc(100vh - 92px);overflow:auto}.field{margin:13px 0}.field strong{display:block;font-size:.82rem}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.form label{font-size:.82rem;font-weight:700}.form input,.form select,.form textarea{display:block;width:100%;border:1px solid var(--divider);border-radius:8px;padding:8px;background:#fff}.wide{grid-column:1/-1}.notice{min-height:24px;color:var(--danger);font-weight:700}.state{font-size:.85rem}.legacy{margin-top:14px}@media(max-width:700px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.detail{position:static;max-height:none}}@media(max-width:390px){.bar,.page{width:calc(100% - 24px)}.actions button{width:100%}.form{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="top"><div class="bar"><span class="brand">Giraffe · 모의투자</span><button id="logout">로그아웃</button></div></header><main class="page"><p class="eyebrow">결정 카드 운영</p><h1>오늘의 검토와 승인</h1><p class="muted">근거와 필터를 확인하고 매수 검토 가능 카드만 승인합니다.</p><div id="notice" class="notice" role="status" aria-live="polite"></div><section id="summary" class="summary" aria-label="요약"><div class="box">불러오는 중…</div></section><p id="schedule" class="muted"></p><nav id="tabs" class="tabs" aria-label="카드 필터"></nav><div class="grid"><section><div id="cards" class="list" aria-live="polite">카드를 불러오는 중…</div><section class="box legacy"><strong>과거 수동 계획</strong><p class="muted">기존 기록은 읽기 전용입니다. 이 화면에서는 새 기록 작성이나 실행을 할 수 없습니다.</p></section></section><aside id="detail" class="detail" hidden></aside></div></main>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decisionLabel={approve:'승인',hold:'보류',reject:'거절'}, planLabel={approved:'승인됨',review_required:'재검토 필요',entry_invalidated:'진입 무효화',partial_or_filled:'보유 중',exit_wait:'매도 대기',closed:'종료',invalidated:'무효화'}; let cards=[],missing=[],tab='전체'; const tabs=['전체','매수 검토 가능','관찰','제외','판단 보류','승인','보류','거절','카드 미생성'];
function korean(v){if(v===null||v===undefined||v==='')return '없음';if(Array.isArray(v))return v.map(korean).join(' · ')||'없음';if(typeof v==='object')return Object.entries(v).map(([k,x])=>`${k}: ${korean(x)}`).join(' · ');return String(v)}
function localValue(iso){if(!iso)return '';const d=new Date(iso);if(Number.isNaN(d))return '';const parts=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d).replace(' ','T');return parts}
function isoKst(v){return v?`${v}:00+09:00`:null}
async function api(path,opt={}){const r=await fetch('/api/'+path,{headers:{'Content-Type':'application/json'},...opt});let d={};try{d=await r.json()}catch{}if(r.status===401){location.assign('/?expired=1');throw Error('세션이 만료되었습니다. 로그인 화면으로 이동합니다.')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'요청을 처리하지 못했습니다.');return d}
function decision(c){return decisionLabel[c.user_state?.decision?.decision]||'미판단'}
function draw(){ $('#tabs').innerHTML=tabs.map(x=>`<button data-tab="${x}" class="${x===tab?'active':''}">${x}</button>`).join(''); const shown=tab==='카드 미생성'?missing:cards.filter(c=>tab==='전체'||c.verdict===tab||decision(c)===tab); $('#cards').innerHTML=shown.length?shown.map(c=>{if(!c.card)return `<article class="card"><b>${esc(c.name||c.symbol)} · ${esc(c.symbol)}</b><p>${esc(c.title||'카드 생성 대기')}</p><small>근거 ${esc(c.source||'없음')} · 확인 ${esc(c.known_at)}</small></article>`;let reasons=c.filter?.reasons||[];return `<article class="card" data-id="${c.id}"><div class="row"><b>${esc(c.evidence?.name||c.evidence?.symbol||c.card.symbol)} · ${esc(c.evidence?.symbol||c.card.symbol)}</b><span class="tag ${c.filter?.verdict==='PASS'?'pass':'fail'}">필터 ${c.filter?.verdict==='PASS'?'통과':'실패'}</span></div><p>${esc(c.card.headline||c.evidence?.title)} · ${esc(c.card.conclusion)}</p><small>첫 이유 ${esc(reasons[0]||'조건 충족')} · 선반영 ${esc(korean(c.card.priced_in))} · 미확인 ${esc(korean(c.card.unknowns))} · ${esc(c.verdict)} · ${decision(c)} · 생성 ${esc(c.generated_at)}</small></article>`}).join(''):'<div class="box">조건에 맞는 카드가 없습니다.</div>'; $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()}); $('#cards').querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>showDetail(x.dataset.id)); }
function field(label,key,value,type='text'){return `<label>${label}<input name="${key}" type="${type}" value="${esc(type==='datetime-local'?localValue(value):value)}"></label>`}
function details(label,value){return `<div class="field"><strong>${label}</strong>${esc(korean(value))}</div>`}
async function showDetail(id){try{const c=await api('cards/'+id), card=c.card, plan=c.user_state.order_plan, draft=c.user_state.draft?.snapshot, values=draft||plan||card, buy=c.verdict==='매수 검토 가능'&&c.filter.verdict==='PASS'; $('#detail').hidden=false; $('#detail').innerHTML=`<div class="row"><h2>${esc(c.evidence.name||c.evidence.symbol)}</h2><button id="close-detail">닫기</button></div>${details('변화',card.change)}${details('출처와 사업 가치',card.source_evidence)}${details('사업 가치',card.business_value)}${details('확실성',card.certainty)}${details('선반영',card.priced_in)}${details('필터',c.filter.verdict==='PASS'?'통과':'실패')}${details('가격 상한',card.price_cap)}${details('진입 구간',card.window)}${details('최대 금액·수량',`${card.max_amount}원 · ${card.max_qty}주`)}${details('손절',card.stop_loss)}${details('익절',card.take_profit)}${details('근거 무효화',card.evidence_invalidation)}${details('보유 종료',card.holding_until)}${details('검토 시각',card.review_at)}${details('오탐 가능성',card.false_positive)}${details('미확인',card.unknowns)}${details('판정·신뢰도',`${c.verdict} · ${card.confidence}`)}<div class="field"><strong>원문 링크</strong>${(card.source_urls||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noreferrer">출처 열기</a>`).join(' · ')||'없음'}</div>${details('필터 이유',c.filter.reasons)}${details('기준·확인 시각',`${c.filter.as_of} / ${c.filter.known_at}`)}<details><summary>보조 메타데이터</summary><p>프롬프트 ${esc(c.prompt_version)} · 해시 ${esc(c.prompt_hash)} · 모델 ${esc(c.model)} · 제공자 ${esc(c.provider)} · 근거/필터 ${c.evidence.id}/${c.filter.id}</p></details>${buy?draftForm(values,plan,id):'<div class="actions"><button id="hold">보류</button><button id="reject">거절</button></div>'}${plan?planView(plan):''}`; $('#close-detail').onclick=()=>$('#detail').hidden=true; ['hold','reject','approve'].forEach(x=>{const b=$('#'+x);if(b)b.onclick=()=>saveDecision(id,x)}); const f=$('#draft');if(f)f.onsubmit=e=>saveDraft(e,id,plan); const close=$('#manual-close');if(close)close.onclick=()=>manualClose(plan.id)}catch(e){$('#notice').textContent=e.message}}
function draftForm(v,plan,id){return `<form id="draft" class="form"><h3 class="wide">승인 전 주문 초안</h3>${field('진입 시작','start',v.window?.start,'datetime-local')}${field('진입 종료','end',v.window?.end,'datetime-local')}${field('가격 상한','price_cap',v.price_cap,'number')}${field('최대 금액','max_amount',v.max_amount,'number')}${field('최대 수량','max_qty',v.max_qty,'number')}<label>주문 유형<select name="order_type"><option value="limit" ${v.order_type==='limit'?'selected':''}>지정가</option><option value="market" ${v.order_type==='market'?'selected':''}>시장가</option></select></label>${field('손절가','stop_loss',v.stop_loss,'number')}${field('익절가','tp_price',v.take_profit?.[0]?.price,'number')}${field('익절 수량','tp_qty',v.take_profit?.[0]?.qty,'number')}${field('보유 종료','holding_until',v.holding_until,'datetime-local')}${field('검토 시각','review_at',v.review_at,'datetime-local')}${field('유효 시각','valid_until',v.valid_until,'datetime-local')}<label class="wide">근거 무효화 조건<textarea name="inv">${esc(typeof v.evidence_invalidation==='string'?v.evidence_invalidation:korean(v.evidence_invalidation))}</textarea></label><p class="wide muted">${plan?'기존 승인 무효화·재승인 필요':''}</p><div class="actions wide"><button class="primary">초안 저장</button><button type="button" class="primary" id="approve">승인</button><button type="button" id="hold">보류</button><button type="button" id="reject">거절</button></div></form>`}
function planView(p){const remaining=(p.bought_qty||0)-(p.sold_qty||0);return `<div class="field"><strong>주문 상태</strong>${esc(planLabel[p.status]||p.status)} · 매수 ${p.bought_qty||0} / 매도 ${p.sold_qty||0} / 잔여 ${remaining}<br>금액 ${p.bought_amount||0} · 포지션 ${esc(korean(p.position))} · 체결 ${esc(korean(p.fills))} · 이벤트 ${esc(korean(p.events))}${remaining>0?'<div class="actions"><button id="manual-close">수동 전량 매도</button></div>':''}</div>`}
async function saveDecision(id,x){try{await api(`cards/${id}/decisions`,{method:'POST',body:JSON.stringify({decision:x})});$('#notice').textContent=x==='approve'?'승인했습니다.':'판단을 저장했습니다.';await load();await showDetail(id)}catch(e){$('#notice').textContent=e.message}}
async function saveDraft(e,id,plan){e.preventDefault();try{const a=new FormData(e.currentTarget), data={window:{start:isoKst(a.get('start')),end:isoKst(a.get('end'))},price_cap:+a.get('price_cap'),max_amount:+a.get('max_amount'),max_qty:+a.get('max_qty'),order_type:a.get('order_type'),stop_loss:+a.get('stop_loss'),take_profit:[{price:+a.get('tp_price'),qty:+a.get('tp_qty')}],evidence_invalidation:{rule:a.get('inv')},holding_until:isoKst(a.get('holding_until')),review_at:isoKst(a.get('review_at')),valid_until:isoKst(a.get('valid_until'))}; await api(plan?`order-plans/${plan.id}/edit`:`cards/${id}/order-plan-draft`,{method:'POST',body:JSON.stringify(data)});$('#notice').textContent=plan?'기존 승인은 무효화되었습니다. 재승인이 필요합니다.':'초안을 저장했습니다.';await showDetail(id)}catch(err){$('#notice').textContent=err.message}}
async function manualClose(id){const price=prompt('현재가를 입력하세요.');if(!price||!confirm('열린 수량 전체를 수동 매도할까요?'))return;try{await api(`order-plans/${id}/close`,{method:'POST',body:JSON.stringify({price:+price,known_at:new Date().toISOString(),server_now:new Date().toISOString(),tick_key:crypto.randomUUID()})});$('#notice').textContent='수동 매도 평가를 요청했습니다.';load()}catch(e){$('#notice').textContent=e.message}}
async function load(){try{const [s,c,m]=await Promise.all([api('cards/summary'),api('cards'),api('cards/missing')]);cards=c;missing=m;$('#summary').innerHTML=['전체 근거','필터 PASS','카드 생성','카드 미생성','매수 검토 가능','판단 보류','승인','보류','거절','실패·근거 부족'].map(k=>`<div class="box"><small>${k}</small><b>${s[k]??0}</b></div>`).join('');$('#schedule').textContent=`최근 07:00 ${s['최근 실행']['07:00'].상태}, 08:00 ${s['최근 실행']['08:00'].상태} · 다음 ${s['다음 실행']['07:00 KST']} / ${s['다음 실행']['08:00 KST']}`;draw()}catch(e){$('#cards').textContent='카드를 불러오지 못했습니다.';$('#notice').textContent=e.message}}
$('#logout').onclick=async()=>{try{await api('logout',{method:'POST'});location.assign('/')}catch(e){$('#notice').textContent=e.message}};load();
</script></body></html>
