<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giraffe · 오늘의 판단</title>
<style>
:root{--primary:#2563eb;--primary-low:#eff6ff;--paper:#f8fafc;--sheet:#fff;--ink:#172033;--ink-low:#64748b;--divider:#dbe3ef;--success:#126b49;--warning:#a95b00;--danger:#c73524;--radius:16px;--shadow:0 8px 24px rgba(23,32,51,.08)}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;min-width:44px;min-height:44px;border:1px solid var(--divider);border-radius:10px;padding:8px 12px;background:var(--sheet);color:var(--ink);font-weight:750}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}.top{background:var(--sheet);border-bottom:1px solid var(--divider)}.bar,.page{width:min(calc(100% - 32px),760px);margin:auto}.bar{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:var(--primary);font-weight:900;letter-spacing:-.03em}.page{padding:28px 0 48px}.eyebrow,.muted{margin:0;color:var(--ink-low)}.eyebrow{color:var(--primary);font-size:.875rem;font-weight:800}h1{margin:4px 0 8px;font-size:clamp(1.75rem,7vw,2.5rem);line-height:1.2;letter-spacing:-.04em}.date-row{display:flex;align-items:end;gap:8px;margin:22px 0}.date-row label{display:grid;gap:4px;font-size:.875rem;font-weight:750}.date-row input{min-height:44px;border:1px solid var(--divider);border-radius:10px;padding:0 10px;background:var(--sheet)}.list{display:grid;gap:10px}.decision-row{width:100%;min-height:124px;text-align:left;padding:16px;border-radius:var(--radius);background:var(--sheet);box-shadow:var(--shadow)}.decision-row:hover{border-color:#93c5fd}.row-top,.row-bottom{display:flex;justify-content:space-between;gap:12px;align-items:start}.identity{font-size:1.05rem;font-weight:850}.symbol,.deadline{color:var(--ink-low);font-size:.875rem}.change{margin:10px 0;color:var(--ink)}.status{display:inline-flex;align-items:center;min-height:26px;border-radius:999px;padding:3px 9px;background:var(--primary-low);color:#174ea6;font-size:.8rem;font-weight:800}.status.warning{background:#fff7e8;color:var(--warning)}.status.danger{background:#fff0ee;color:var(--danger)}.state,.notice{border:1px solid var(--divider);border-radius:var(--radius);padding:18px;background:var(--sheet)}.state h2{margin:0 0 6px;font-size:1.1rem}.notice{margin-bottom:12px;border-color:#f6bfba;background:#fff7f6;color:#94291e}.skeleton{height:124px;border-radius:var(--radius);background:linear-gradient(90deg,#eef2f7,#f8fafc,#eef2f7);background-size:200% 100%;animation:loading 1.4s ease-in-out infinite}.dialog{position:fixed;inset:0;z-index:10;display:grid;align-items:end;background:rgba(23,32,51,.42)}.dialog[hidden]{display:none}.dialog-sheet{max-height:min(88dvh,760px);overflow:auto;background:var(--sheet);border-radius:20px 20px 0 0;padding:18px 16px 36px;box-shadow:0 -12px 36px rgba(23,32,51,.18)}.dialog-inner{width:min(100%,720px);margin:auto}.dialog-head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:18px}.dialog-head h2{margin:0;font-size:1.35rem;line-height:1.3}.close{flex:none}.detail-section{border-top:1px solid var(--divider);padding:18px 0}.detail-section h3{margin:0 0 8px;font-size:1rem}.detail-section p{margin:0}.fact-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}.fact{border-left:3px solid var(--divider);padding-left:10px}.fact b{display:block}.fact small{display:block;color:var(--ink-low);margin-top:2px}.fact a{color:#174ea6;font-weight:750}.disclosure{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;margin-top:10px}.disclosure-panel{padding:12px 0}.scenario-grid{display:grid;gap:8px}.scenario{border:1px solid var(--divider);border-radius:12px;padding:12px}.scenario.current{border:2px solid var(--primary);background:var(--primary-low)}.scenario-current{display:block;color:#174ea6;font-size:.85rem;font-weight:850;margin-top:5px}.automation{border-radius:12px;background:#f1f5f9;padding:14px}.automation p{margin:2px 0}.session-link{color:#174ea6;font-weight:750}@keyframes loading{50%{background-position:-100% 0}}@media(min-width:700px){.dialog{align-items:center;padding:24px}.dialog-sheet{width:min(100%,760px);border-radius:20px}.dialog-inner{width:100%}}@media(max-width:390px){.bar,.page{width:calc(100% - 24px)}.date-row{align-items:stretch;flex-direction:column}.date-row button{width:100%}.row-top,.row-bottom{flex-direction:column;gap:4px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="top"><div class="bar"><span class="brand">Giraffe</span><button id="logout" type="button">로그아웃</button></div></header><main id="app-main" class="page"><p class="eyebrow">변화 중심 판단</p><h1>오늘 판단이 필요한 종목</h1><p class="muted">마지막 확인 이후 중요한 변화가 있는 종목만 표시합니다.</p><div id="error" class="notice" role="status" aria-live="polite" hidden></div><div class="date-row"><label>선택 운영일 <input id="date" type="date" aria-label="선택 운영일"></label><button id="today" type="button">오늘</button></div><section id="cards" class="list" aria-live="polite" aria-label="판단 목록"><div class="skeleton" aria-label="판단 목록 불러오는 중"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div></section></main><section id="detail" class="dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden><div class="dialog-sheet"><div class="dialog-inner"><div class="dialog-head"><div><p class="eyebrow">판단 상세</p><h2 id="detail-title">판단 상세</h2></div><button id="detail-close" class="close" type="button" aria-label="상세 닫기">닫기</button></div><div id="detail-content"></div></div></div></section>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cards=[],missing=[],lastGood=[],opener=null,detailGeneration=0,detailAbort=null,detailOwner=null;
function korean(v){if(v===null||v===undefined||v==='')return '확인 필요';if(Array.isArray(v))return v.length?v.map(korean).join(' · '):'확인 필요';if(typeof v==='object')return Object.values(v).map(korean).join(' · ')||'확인 필요';return String(v)}
function kst(v){if(!v)return '확인 필요';const d=new Date(v);return Number.isNaN(d)?'확인 필요':new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
async function api(path,options={}){const r=await fetch('/api/'+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){$('#error').hidden=false;$('#error').innerHTML='세션이 만료되었습니다. <a class="session-link" href="/?expired=1">로그인 화면으로 이동</a>';throw Error('session expired')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'현재 정보를 갱신하지 못했습니다.');return d}
function statusFor(c){if(c.invalidated_at)return ['가설 폐기 조건 충족','danger'];if(c.card?.verdict==='판단 보류')return ['판단 보류 · '+(c.card?.unknowns?.length?'일부 확인 필요':'정보가 오래됨'),'warning'];return [c.card?.verdict||'일부 확인 필요','']}
function deadline(c){const x=c.card||{};return x.review_at||x.valid_until||x.expires||x.window?.end||c.generated_at||c.known_at}
function row(c){const x=c.card||{},e=c.evidence||c,unmade=!c.card;const [normalLabel,kind]=statusFor(c);const noSource=!e.source&&!e.source_url,label=unmade?(noSource?'판단 시작 불가 · 출처 없음':'카드 생성 대기 · 확인 필요'):normalLabel;const name=e.name||x.name||e.symbol||x.symbol||'종목 확인 필요',symbol=e.symbol||x.symbol||'확인 필요';const change=x.headline||x.conclusion||e.summary||e.title||(unmade?'판단 카드가 아직 준비되지 않았습니다.':'마지막 판단 이후 변화는 확인 필요');return `<button class="decision-row" type="button" data-id="${esc(c.id||'')}" data-kind="${unmade?'missing':'card'}" ${c.id?'':'disabled'}><span class="row-top"><span><span class="identity">${esc(name)}</span> <span class="symbol">${esc(symbol)}</span></span><span class="status ${unmade?'warning':kind}">${esc(label)}</span></span><span class="change">${esc(change)}</span><span class="row-bottom"><span class="deadline">다음 확인: ${esc(kst(deadline(c)))}</span></span></button>`}
function emptyState(){return `<section class="state"><h2>${missing.length?'일부 카드가 아직 준비되지 않았습니다.':'지금 다시 판단할 종목이 없습니다'}</h2><p class="muted">${missing.length?'판단 시작 불가 · 출처 또는 카드 정보 확인 필요':'아직 관찰 종목이 없으면 종목 또는 공시를 추가한 뒤 다시 확인하세요.'}</p></section>`}
function draw(){const all=[...cards,...missing];$('#cards').innerHTML=all.length?all.map(row).join(''):emptyState();$('#cards').querySelectorAll('[data-id]').forEach(button=>button.addEventListener('click',()=>{const item=button.dataset.kind==='missing'?missing.find(x=>String(x.id)===button.dataset.id):null;item?openMissingDetail(item,button):openDetail(button.dataset.id,button)}))}
function missingDetail(e){const hasSource=Boolean(e.source||e.source_url),link=safeSourceLink(e.source_url);return `<section class="detail-section"><h3>${hasSource?'카드 생성 대기 · 확인 필요':'판단 시작 불가 · 출처 없음'}</h3><p>판단 카드가 없어 현재 판단과 조건별 시나리오를 시작할 수 없습니다.</p><p>누락 영향: 원문과 공개 확인 시각을 카드 판단에 연결하기 전에는 판단을 진행하지 않습니다.</p><p>출처: ${esc(e.source||'확인 필요')} · 공개 확인 시각: ${esc(kst(e.known_at))}</p>${link?`<p>${link}</p>`:'<p><b>원문 연결 필요</b> · 확인 필요</p>'}</section><section class="detail-section"><h3>자동화 단계</h3><div class="automation"><p><b>현재 단계: 기록 전용</b></p><p>주문 기능 없음</p></div></section>`}
function safeSourceLink(url){if(typeof url!=='string'||!url||url!==url.trim()||/[\\\x00-\x1f\x7f]/.test(url))return '';const authority=url.match(/^https?:\/\/([^\/?#]*)/);if(!authority||/[@%\\]/.test(authority[1]))return '';try{const parsed=new URL(url),host=parsed.hostname;if(!['http:','https:'].includes(parsed.protocol)||parsed.username||parsed.password||!host||host!==host.toLowerCase()||host.endsWith('.')||!host.split('.').every(x=>/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(x))||!/^([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?::[1-9]\d{0,4})?$/.test(authority[1])||(parsed.port&&Number(parsed.port)>65535))return '';return `<a href="${esc(parsed.href)}" target="_blank" rel="noopener noreferrer">원문 보기</a>`}catch{return ''}}
function sourceFacts(c){const facts=c.source_facts||{},link=safeSourceLink(facts.source_url),trust=link?(facts.trust_state||'확인 필요'):'확인 필요';return `<li class="fact"><b>${esc(facts.source||'확인 필요')}</b><small>공개 확인 시각: ${esc(kst(facts.known_at))}</small><small>마지막 확인 성공시각: ${esc(kst(facts.last_success_at))}</small><small>신뢰 상태: ${esc(trust)}</small>${link||'확인 필요'}</li>`}
function trustedScenario(c){const item=c.event_scenarios?.[0],current=item?.current||{},trust=item?.trust||{};const label=current.active_scenario_label;const labels=(item?.scenarios||[]).map(x=>x.label);const trusted=item?.tracking_state==='ACTIVE'&&trust.status==='READY'&&trust.freshness==='FRESH'&&trust.context_readiness==='READY'&&current.market_context_status==='VERIFIED'&&['GOOD_MATCH','BASE_MATCH','BAD_MATCH'].includes(current.match)&&!c.invalidated_at&&labels.includes(label);return trusted?label:null}
function scenarioLabel(label){return ({GOOD:'상방 조건',BASE:'기준 조건',BAD:'하방 조건'})[label]||'확인 필요'}
function scenarios(c){const item=c.event_scenarios?.[0],active=trustedScenario(c),items=item?.scenarios||[];if(!items.length)return '<p class="muted">조건별 시나리오가 아직 확인되지 않았습니다.</p>';return `<div class="scenario-grid">${items.map(s=>{const on=s.label===active;return `<article class="scenario ${on?'current':''}" ${on?'aria-current="true"':''}><b>${esc(scenarioLabel(s.label))}</b>${on?'<span class="scenario-current">현재 확인된 조건과 가장 가까움</span>':''}<p class="muted">${esc(korean(s.conditions||s.description||s.assumptions))}</p></article>`}).join('')}</div>`}
function renderDetail(c){const x=c.card||{},e=c.evidence||{},invalid=c.invalidated_at;const change=x.headline||x.conclusion||e.summary||'확인 필요';const judgment=invalid?'가설 폐기 조건 충족':x.conclusion||c.verdict||'확인 필요';const next=x.proof_point||x.next_check||x.review_at||x.valid_until||'확인 필요';const blockers=[...(x.unknowns||[]),...(c.filter?.reasons||[])];return `<section class="detail-section"><h3>무엇이 달라졌나</h3><p>${esc(change)}</p></section><section class="detail-section"><h3>현재 판단</h3><p>${esc(judgment)}</p></section><section class="detail-section"><h3>지금 할 일과 다음 확인 항목</h3><p>${esc(korean(x.action||x.next_action||'다음 확인 항목: '+korean(next)))}</p></section><section class="detail-section"><h3>판단을 막는 누락·충돌</h3><p>${esc(blockers.length?korean(blockers):'현재 확인된 누락·충돌 없음')}</p></section><button class="disclosure" id="scenarios-toggle" type="button" aria-expanded="false" aria-controls="scenarios-panel">조건별 시나리오 <span aria-hidden="true">⌄</span></button><section id="scenarios-panel" class="disclosure-panel" hidden>${scenarios(c)}</section><button class="disclosure" id="history-toggle" type="button" aria-expanded="false" aria-controls="history-panel">출처와 변경 이력 <span aria-hidden="true">⌄</span></button><section id="history-panel" class="disclosure-panel" hidden><ul class="fact-list">${sourceFacts(c)}</ul></section><section class="detail-section"><h3>자동화 단계</h3><div class="automation"><p><b>현재 단계: 기록 전용</b></p><p>주문 기능 없음</p></div></section>`}
function visibleFocusable(root){return [...root.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>{for(let n=x;n&&n!==root.parentElement;n=n.parentElement){if(n.hidden||n.getAttribute('aria-hidden')==='true'||getComputedStyle(n).display==='none'||getComputedStyle(n).visibility==='hidden')return false}return true})}
function ownsDetail(id,generation,controller){return detailGeneration===generation&&detailOwner===String(id)&&detailAbort===controller}
function invalidateDetail(){detailGeneration++;detailOwner=null;if(detailAbort)detailAbort.abort();detailAbort=null}
function showDetail(title,content,button){opener=button;$('#detail-title').textContent=title;$('#detail-content').innerHTML=content;$('#detail').hidden=false;$('#app-main').inert=true;$('#app-main').setAttribute('aria-hidden','true');$('#detail-close').focus()}
function closeDetail(){const d=$('#detail');if(d.hidden){invalidateDetail();return}invalidateDetail();d.hidden=true;$('#app-main').inert=false;$('#app-main').removeAttribute('aria-hidden');opener?.focus()}
function disclosure(id){const panel=$('#'+id+'-panel'),button=$('#'+id+'-toggle');button.addEventListener('click',()=>{panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden))})}
function openMissingDetail(evidence,button){invalidateDetail();showDetail(`${evidence.name||evidence.symbol||'근거'} 복구 안내`,missingDetail(evidence),button)}
async function openDetail(id,button){invalidateDetail();const generation=detailGeneration,controller=new AbortController();detailOwner=String(id);detailAbort=controller;opener=button;try{const c=await api('cards/'+id,{signal:controller.signal});if(!ownsDetail(id,generation,controller))return;showDetail(`${c.evidence?.name||c.card?.symbol||'종목'} 판단 상세`,renderDetail(c),button);disclosure('scenarios');disclosure('history')}catch(error){if(!ownsDetail(id,generation,controller)||error.name==='AbortError'||error.message==='session expired')return;detailAbort=null;$('#error').hidden=false;$('#error').textContent='상세 정보를 불러오지 못했습니다. 가능한 정보는 목록에서 계속 확인할 수 있습니다.'}}
async function load(){invalidateDetail();const day=encodeURIComponent($('#date').value),q=`?operation_date=${day}`;try{const [summary,list,unmade]=await Promise.all([api('cards/summary'+q),api('cards'+q),api('cards/missing'+q)]);cards=list;missing=unmade;lastGood=[...list,...unmade];$('#error').hidden=true;draw()}catch(error){if(error.message==='session expired')return;if(lastGood.length){cards=lastGood;missing=[];draw()}$('#error').hidden=false;$('#error').textContent='현재 정보를 갱신하지 못했습니다. 마지막으로 확인한 목록을 유지합니다.'}}
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('#date').value=today();$('#date').onchange=load;$('#today').onclick=()=>{$('#date').value=today();load()};$('#logout').onclick=async()=>{try{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'}})}finally{location.assign('/')}};$('#detail-close').onclick=closeDetail;document.addEventListener('keydown',event=>{if($('#detail').hidden)return;if(event.key==='Escape'){event.preventDefault();closeDetail();return}if(event.key==='Tab'){const items=visibleFocusable($('#detail'));if(!items.length)return;const first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});load();
</script></body></html>
