<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giraffe · 결정 카드</title>
<style>
:root{--primary:#2563eb;--primary-low:#eff6ff;--paper:#f8fafc;--sheet:#fff;--ink:#172033;--ink-low:#64748b;--divider:#dbe3ef;--success:#087443;--danger:#b42318;--radius:14px}*{box-sizing:border-box;min-width:0;max-width:100%}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;min-height:44px}button{cursor:pointer;border:1px solid var(--divider);border-radius:10px;padding:0 12px;background:var(--sheet);font-weight:700}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.top{position:sticky;top:0;z-index:2;background:var(--sheet);border-bottom:1px solid var(--divider)}.bar,.page{width:min(calc(100% - 32px),1120px);margin:auto}.bar{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;color:var(--primary);font-size:1.2rem}.page{padding:24px 0 48px}.eyebrow,.muted{margin:0}.eyebrow{color:var(--primary);font-weight:800}.muted{color:var(--ink-low)}h1{margin:4px 0 8px;font-size:clamp(1.8rem,5vw,2.5rem)}.settings{display:flex;align-items:end;flex-wrap:wrap;gap:8px;margin:18px 0}.settings label{display:grid;gap:4px;font-size:.82rem;font-weight:700}.settings input{width:min(100%,220px);border:1px solid var(--divider);border-radius:8px;padding:8px;background:#fff}.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:18px 0}.box,.card,.detail{background:var(--sheet);border:1px solid var(--divider);border-radius:var(--radius);padding:14px;max-width:100%}.box small{color:var(--ink-low)}.box b{display:block;font-size:1.3rem}.tabs,.actions{display:flex;flex-wrap:wrap;gap:8px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0;overflow-x:auto}.filters label{display:grid;gap:4px;font-size:.82rem;font-weight:700}.filters select{width:100%;border:1px solid var(--divider);border-radius:8px;padding:8px;background:#fff}.filter-reset{align-self:end}.tabs{overflow-x:auto;padding-bottom:10px}.tabs button{white-space:nowrap}.active,.primary{background:var(--primary);border-color:var(--primary);color:#fff}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:14px}.list{display:grid;gap:10px}.card{cursor:pointer}.card.purchased{background:#ecfdf3;border-color:#63b98c}.row{display:flex;justify-content:space-between;align-items:start;gap:8px}.tag{border-radius:999px;padding:3px 8px;background:var(--primary-low);font-size:.78rem;white-space:nowrap}.pass{color:var(--success)}.fail{color:var(--danger)}.detail{position:sticky;top:78px;max-height:calc(100vh - 92px);overflow:auto}.field{margin:13px 0}.field strong{display:block;font-size:.82rem}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.form label{font-size:.82rem;font-weight:700}.form input,.form select,.form textarea{display:block;width:100%;border:1px solid var(--divider);border-radius:8px;padding:8px;background:#fff}.wide{grid-column:1/-1}.notice{min-height:24px;color:var(--danger);font-weight:700}.state{font-size:.85rem}.legacy{margin-top:14px}@media(max-width:700px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.detail{position:static;max-height:none}}@media(max-width:390px){.bar,.page{width:calc(100% - 24px)}.actions button{width:100%}.form{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header class="top"><div class="bar"><span class="brand">Giraffe · 모의투자</span><button id="logout">로그아웃</button></div></header><main class="page"><p class="eyebrow">결정 카드 운영</p><h1>오늘의 검토와 승인</h1><p class="muted">근거와 필터를 확인하고 매수 검토 가능 카드만 승인합니다. 승인 후에도 fresh quote/tick과 동결 조건 재검증이 끝나야 paper fill을 검토합니다.</p><section class="settings box" aria-label="모의투자 설정"><label>기본 모의투자 금액 <input id="default-paper-amount" type="number" inputmode="numeric" min="10000" max="1000000000" step="1" aria-label="기본 모의투자 금액"></label><button id="save-default-paper" type="button" class="primary">기본 금액 저장</button><span id="paper-setting-feedback" class="muted" role="status" aria-live="polite"></span></section><div id="notice" class="notice" role="status" aria-live="polite"></div><div class="actions"><label>기준일 <input id="date" type="date" aria-label="기준일"></label><button id="previous">이전 날짜</button><button id="today" class="primary">오늘</button></div><section id="summary" class="summary" aria-label="요약"><div class="box">불러오는 중…</div></section><p id="schedule" class="muted"></p><section class="filters" aria-label="카드 필터"><label>판단<select id="verdict-filter"><option value="전체">전체</option><option>매수 검토 가능</option><option>관찰</option><option>제외</option><option>판단 보류</option></select></label><label>내 결정<select id="decision-filter"><option value="전체">전체</option><option value="approve">승인</option><option value="hold">보류</option><option value="reject">거절</option><option value="undecided">미판단</option></select></label><label>체결<select id="fill-filter"><option value="전체">전체</option><option value="bought">매수</option><option value="sold_complete">매도완료</option><option value="unfilled">미체결</option></select></label><label>카드 상태<select id="status-filter"><option value="전체">전체</option><option value="current">현재</option><option value="invalid">무효</option><option value="missing">카드 미생성</option></select></label><button id="reset-filters" class="filter-reset" type="button">필터 초기화</button></section><div class="grid"><section><div id="cards" class="list" aria-live="polite">카드를 불러오는 중…</div><section class="box legacy"><strong>과거 수동 계획</strong><p class="muted">기존 기록은 읽기 전용입니다. 이 화면에서는 새 기록 작성이나 실행을 할 수 없습니다.</p></section></section><aside id="detail" class="detail" hidden></aside></div></main>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decisionLabel={approve:'승인',hold:'보류',reject:'거절'}, planLabel={approved:'승인됨',review_required:'재검토 필요',entry_invalidated:'진입 무효화',partial_or_filled:'보유 중',exit_wait:'매도 대기',closed:'종료',invalidated:'무효화'}; let cards=[],missing=[],tab='전체'; const tabs=['전체','매수 검토 가능','관찰','제외','판단 보류','승인','보류','거절','카드 미생성'];
function korean(v){if(v===null||v===undefined||v==='')return '해당 없음';if(Array.isArray(v))return v.map(korean).join(' · ')||'해당 없음';if(typeof v==='object')return Object.entries(v).map(([k,x])=>`${k}: ${korean(x)}`).join(' · ')||'해당 없음';return String(v)}
function localValue(iso){if(!iso)return '';const d=new Date(iso);if(Number.isNaN(d))return '';const parts=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d).replace(' ','T');return parts}
function isoKst(v){return v?`${v}:00+09:00`:null}
async function api(path,opt={}){const r=await fetch('/api/'+path,{headers:{'Content-Type':'application/json'},...opt});let d={};try{d=await r.json()}catch{}if(r.status===401){location.assign('/?expired=1');throw Error('세션이 만료되었습니다. 로그인 화면으로 이동합니다.')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'요청을 처리하지 못했습니다.');return d}
async function loadPaperSetting(){try{const s=await api('settings/paper');$('#default-paper-amount').value=s.default_paper_amount;$('#paper-setting-feedback').textContent=`${Number(s.default_paper_amount).toLocaleString('ko-KR')}원`; }catch(e){$('#paper-setting-feedback').textContent=e.message}}
async function savePaperSetting(){try{const amount=Number($('#default-paper-amount').value);const s=await api('settings/paper',{method:'PATCH',body:JSON.stringify({default_paper_amount:amount})});$('#default-paper-amount').value=s.default_paper_amount;$('#paper-setting-feedback').textContent=`기본 금액을 ${Number(s.default_paper_amount).toLocaleString('ko-KR')}원으로 저장했습니다.`}catch(e){$('#paper-setting-feedback').textContent=e.message}}
function decision(c){return c.card?(c.user_state?.decision?.decision||'undecided'):'undecided'}function status(c){return c.card?(c.invalidated_at?'invalid':'current'):'missing'}function fill(c){return c.card?(c.fill_summary?.fill_state||'unfilled'):'unfilled'}
function selected(id){return $('#'+id).value}function filterCards(items,filters){return items.filter(c=>(filters.verdict==='전체'||(c.card&&c.verdict===filters.verdict))&&(filters.decision==='전체'||decision(c)===filters.decision)&&(filters.fill==='전체'||fill(c)===filters.fill)&&(filters.status==='전체'||status(c)===filters.status))}function matches(c){return filterCards([c],{verdict:selected('verdict-filter'),decision:selected('decision-filter'),fill:selected('fill-filter'),status:selected('status-filter')}).length===1}
function kst(iso){if(!iso)return '-';const d=new Date(iso);return Number.isNaN(d)?'-':new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}function timestamps(summary){return `<small>매수일시 ${esc(kst(summary?.first_buy_at))} · 매도일시 ${esc(kst(summary?.last_full_sell_at))}</small>`}
function draw(){const shown=[...cards,...missing].filter(matches);$('#cards').innerHTML=shown.length?shown.map(c=>{if(!c.card)return `<article class="card"><b>${esc(c.name||c.symbol)} · ${esc(c.symbol)}</b><p>${esc(c.title||'카드 생성 대기')}</p><small>근거 ${esc(c.source||'없음')} · 확인 ${esc(c.known_at)}</small>${timestamps()}</article>`;let reasons=c.filter?.reasons||[];const bought=Boolean(c.fill_summary?.first_buy_at);return `<article class="card ${bought?'purchased':''}" data-id="${c.id}"><div class="row"><b>${esc(c.evidence?.name||c.evidence?.symbol||c.card.symbol)} · ${esc(c.evidence?.symbol||c.card.symbol)}</b><span class="tag ${c.filter?.verdict==='PASS'?'pass':'fail'}">필터 ${c.filter?.verdict==='PASS'?'통과':'실패'}</span></div><p>${esc(c.card.headline||c.evidence?.title)} · ${esc(c.card.conclusion)}</p><small>첫 이유 ${esc(reasons[0]||'조건 충족')} · 선반영 ${esc(korean(c.card.priced_in))} · 미확인 ${esc(korean(c.card.unknowns))} · ${esc(c.verdict)} · ${esc(decisionLabel[decision(c)]||'미판단')} · 생성 ${esc(c.generated_at)}</small>${timestamps(c.fill_summary)}</article>`}).join(''):'<div class="box">조건에 맞는 카드가 없습니다. 필터를 바꾸거나 다른 기준일을 선택하세요.</div>'; $('#cards').querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>showDetail(x.dataset.id)); }
function field(label,key,value,type='text'){return `<label>${label}<input name="${key}" type="${type}" value="${esc(type==='datetime-local'?localValue(value):value)}"></label>`}
function details(label,value){return `<div class="field"><strong>${label}</strong>${esc(korean(value))}</div>`}
function draftValues(c){return c.user_state?.draft?.snapshot||c.user_state?.order_plan?.snapshot||{...c.card,max_amount:c.user_state?.default_paper_amount}}
async function showDetail(id){try{const c=await api('cards/'+id), card=c.card, plan=c.user_state.order_plan, draft=c.user_state.draft, values=draftValues(c), buy=c.verdict==='매수 검토 가능'&&c.filter.verdict==='PASS'; $('#detail').hidden=false; $('#detail').innerHTML=`<div class="row"><h2>${esc(c.evidence.name||c.evidence.symbol)}</h2><button id="close-detail">닫기</button></div>${details('재료 업무일',c.evidence.known_at?.slice(0,10))}${details('원문 발표시각',c.evidence.announcement_at)}${details('카드 생성시각',c.generated_at)}${details('카드 버전',c.version)}${details('근거/카드 무효 상태',`${c.evidence.status} / ${c.invalidated_at?'무효':'현재'}`)}${details('매수일시',kst(c.fill_summary?.first_buy_at))}${details('매도일시',kst(c.fill_summary?.last_full_sell_at))}${details('변화',card.change)}${details('출처와 사업 가치',card.source_evidence)}${details('사업 가치',card.business_value)}${details('확실성',card.certainty)}${details('선반영',card.priced_in)}${details('필터',c.filter.verdict==='PASS'?'통과':'실패')}${details('가격 상한',card.price_cap)}${details('진입 구간',card.window)}${details('최대 금액·수량',`${card.max_amount}원 · ${card.max_qty}주`)}${details('손절',card.stop_loss)}${details('익절',card.take_profit)}${details('근거 무효화',card.evidence_invalidation)}${details('보유 종료',card.holding_until)}${details('검토 시각',card.review_at)}${details('오탐 가능성',card.false_positive)}${details('미확인',card.unknowns)}${details('판정·신뢰도',`${c.verdict} · ${card.confidence}`)}<div class="field"><strong>원문 링크</strong>${(card.source_urls||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noreferrer">출처 열기</a>`).join(' · ')||'없음'}</div>${details('필터 이유',c.filter.reasons)}${details('기준·확인 시각',`${c.filter.as_of} / ${c.filter.known_at}`)}<details><summary>보조 메타데이터</summary><p>프롬프트 ${esc(c.prompt_version)} · 해시 ${esc(c.prompt_hash)} · 모델 ${esc(c.model)} · 제공자 ${esc(c.provider)} · 근거/필터 ${c.evidence.id}/${c.filter.id}</p></details>${buy?draftForm(values,plan,id):'<div class="actions"><button id="hold">보류</button><button id="reject">거절</button></div>'}${plan?planView(plan):''}`; $('#close-detail').onclick=()=>$('#detail').hidden=true; ['hold','reject','approve'].forEach(x=>{const b=$('#'+x);if(b)b.onclick=()=>saveDecision(id,x)}); const f=$('#draft');if(f)f.onsubmit=e=>saveDraft(e,id,plan); const close=$('#manual-close');if(close)close.onclick=()=>manualClose(plan.id)}catch(e){$('#notice').textContent=e.message}}
function draftForm(v,plan,id){return `<form id="draft" class="form"><h3 class="wide">승인 전 주문 초안</h3>${field('진입 시작','start',v.window?.start,'datetime-local')}${field('진입 종료','end',v.window?.end,'datetime-local')}${field('가격 상한','price_cap',v.price_cap,'number')}${field('이 카드에 적용할 금액','max_amount',v.max_amount,'number')}${field('최대 수량','max_qty',v.max_qty,'number')}<label>주문 유형<select name="order_type"><option value="limit" ${v.order_type==='limit'?'selected':''}>지정가</option><option value="market" ${v.order_type==='market'?'selected':''}>시장가</option></select></label>${field('손절가','stop_loss',v.stop_loss,'number')}${field('익절가','tp_price',v.take_profit?.[0]?.price,'number')}${field('익절 수량','tp_qty',v.take_profit?.[0]?.qty,'number')}${field('보유 종료','holding_until',v.holding_until,'datetime-local')}${field('검토 시각','review_at',v.review_at,'datetime-local')}${field('유효 시각','valid_until',v.valid_until,'datetime-local')}${field('만료 시각','expires',v.expires,'datetime-local')}<label class="wide">근거 무효화 조건<textarea name="inv">${esc(typeof v.evidence_invalidation==='string'?v.evidence_invalidation:korean(v.evidence_invalidation))}</textarea></label><p class="wide muted">${plan?'기존 승인 무효화·재승인 필요':''}</p><div class="actions wide"><button class="primary">초안 저장</button><button type="button" class="primary" id="approve">승인</button><button type="button" id="hold">보류</button><button type="button" id="reject">거절</button></div></form>`}
function planView(p){const remaining=(p.bought_qty||0)-(p.sold_qty||0);return `<div class="field"><strong>주문 상태</strong>${esc(planLabel[p.status]||p.status)} · 매수 ${p.bought_qty||0} / 매도 ${p.sold_qty||0} / 잔여 ${remaining}<br>금액 ${p.bought_amount||0} · 포지션 ${esc(korean(p.position))} · 체결 ${esc(korean(p.fills))} · 이벤트 ${esc(korean(p.events))}${remaining>0?'<div class="actions"><button id="manual-close">수동 전량 매도</button></div>':''}</div>`}
async function saveDecision(id,x){try{await api(`cards/${id}/decisions`,{method:'POST',body:JSON.stringify({decision:x})});$('#notice').textContent=x==='approve'?'승인했습니다.':'판단을 저장했습니다.';await load();await showDetail(id)}catch(e){$('#notice').textContent=e.message}}
async function saveDraft(e,id,plan){e.preventDefault();try{const a=new FormData(e.currentTarget), data={window:{start:isoKst(a.get('start')),end:isoKst(a.get('end'))},price_cap:+a.get('price_cap'),max_amount:+a.get('max_amount'),max_qty:+a.get('max_qty'),order_type:a.get('order_type'),stop_loss:+a.get('stop_loss'),take_profit:[{price:+a.get('tp_price'),qty:+a.get('tp_qty')}],evidence_invalidation:{rule:a.get('inv')},holding_until:isoKst(a.get('holding_until')),review_at:isoKst(a.get('review_at')),valid_until:isoKst(a.get('valid_until')),expires:isoKst(a.get('expires'))}; await api(plan?`order-plans/${plan.id}/edit`:`cards/${id}/order-plan-draft`,{method:'POST',body:JSON.stringify(data)});$('#notice').textContent=plan?'기존 승인은 무효화되었습니다. 재승인이 필요합니다.':'초안을 저장했습니다.';await showDetail(id)}catch(err){$('#notice').textContent=err.message}}
async function manualClose(id){const price=prompt('현재가를 입력하세요.');if(!price||!confirm('열린 수량 전체를 수동 매도할까요?'))return;try{await api(`order-plans/${id}/close`,{method:'POST',body:JSON.stringify({price:+price,known_at:new Date().toISOString(),server_now:new Date().toISOString(),tick_key:crypto.randomUUID()})});$('#notice').textContent='수동 매도 평가를 요청했습니다.';load()}catch(e){$('#notice').textContent=e.message}}
async function load(){try{const day=encodeURIComponent($('#date').value),q=`?date=${day}`;const [s,c,m]=await Promise.all([api('cards/summary'+q),api('cards'+q),api('cards/missing'+q)]);cards=c;missing=m;$('#summary').innerHTML=['전체 근거','필터 PASS','필터 FAIL','카드 생성','카드 미생성','매수 검토 가능','판단 보류','승인','보류','거절','오류','무효화','판단 대기','실패·근거 부족'].map(k=>`<div class="box"><small>${k}</small><b>${s[k]??0}</b></div>`).join('');$('#schedule').textContent=`${s.기준일} 재료 업무일 · 최근 07:00 ${s['최근 실행']['07:00'].상태}, 08:00 ${s['최근 실행']['08:00'].상태}`;draw()}catch(e){$('#cards').textContent='카드를 불러오지 못했습니다. 잠시 후 다시 시도하세요.';$('#notice').textContent=e.message}}
const previousBusinessDate=day=>{const [year,month,date]=day.split('-').map(Number);return new Date(Date.UTC(year,month-1,date-1)).toISOString().slice(0,10)};$('#date').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('#date').onchange=load;$('#today').onclick=()=>{$('#date').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());load()};$('#previous').onclick=()=>{$('#date').value=previousBusinessDate($('#date').value);load()};['verdict-filter','decision-filter','fill-filter','status-filter'].forEach(id=>$('#'+id).onchange=draw);$('#reset-filters').onclick=()=>{['verdict-filter','decision-filter','fill-filter','status-filter'].forEach(id=>$('#'+id).value='전체');draw()};$('#logout').onclick=async()=>{try{await api('logout',{method:'POST'});location.assign('/')}catch(e){$('#notice').textContent=e.message}};$('#save-default-paper').onclick=savePaperSetting;loadPaperSetting();load();
</script></body></html>
