services:
  app:
    build:
      context: .
    image: kr-stock-autotrader:${IMAGE_TAG:-latest}
    container_name: kr-stock-autotrader
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      DATABASE_PATH: /data/autotrader.db
      COOKIE_SECURE: "true"
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
      KR_HOLIDAYS: ${KR_HOLIDAYS:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      LIVE_TRADING: "false"
      KIS_APP_KEY: ${KIS_APP_KEY:?KIS_APP_KEY is required}
      KIS_APP_SECRET: ${KIS_APP_SECRET:?KIS_APP_SECRET is required}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO:?KIS_ACCOUNT_NO is required}
      KIS_ACCOUNT_PRODUCT_CODE: ${KIS_ACCOUNT_PRODUCT_CODE:-01}
      KIS_BASE_URL: https://openapi.koreainvestment.com:9443
      GIRAFFE_MIN_TRADING_VALUE_KRW: ${GIRAFFE_MIN_TRADING_VALUE_KRW:?GIRAFFE_MIN_TRADING_VALUE_KRW is required}
      GIRAFFE_MIN_MARKET_CAP_KRW: ${GIRAFFE_MIN_MARKET_CAP_KRW:?GIRAFFE_MIN_MARKET_CAP_KRW is required}
      GIRAFFE_MAX_MARKET_CAP_KRW: ${GIRAFFE_MAX_MARKET_CAP_KRW:?GIRAFFE_MAX_MARKET_CAP_KRW is required}
      GIRAFFE_MAX_RECENT_RISE_PCT: ${GIRAFFE_MAX_RECENT_RISE_PCT:?GIRAFFE_MAX_RECENT_RISE_PCT is required}
      GIRAFFE_MAX_GAP_PCT: ${GIRAFFE_MAX_GAP_PCT:?GIRAFFE_MAX_GAP_PCT is required}
      GIRAFFE_FILTER_CONFIG_VERSION: ${GIRAFFE_FILTER_CONFIG_VERSION:?GIRAFFE_FILTER_CONFIG_VERSION is required}
      GIRAFFE_SHORT_TERM_RISE_SESSIONS: ${GIRAFFE_SHORT_TERM_RISE_SESSIONS:?GIRAFFE_SHORT_TERM_RISE_SESSIONS is required}
      GIRAFFE_MAX_SHORT_TERM_EXCESS_RISE_PCT: ${GIRAFFE_MAX_SHORT_TERM_EXCESS_RISE_PCT:?GIRAFFE_MAX_SHORT_TERM_EXCESS_RISE_PCT is required}
      GIRAFFE_MAX_PRE_RETURN_PCT: ${GIRAFFE_MAX_PRE_RETURN_PCT:?GIRAFFE_MAX_PRE_RETURN_PCT is required}
    volumes:
      - ./data:/data
    networks:
      - web_gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  web_gateway:
    external: true
    name: caddy-web-gateway_default
